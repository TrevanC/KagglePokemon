# Behavioral cloning training hyperparameters.
#
# Consumed by: scripts/train_bc.py -> src/training/trainer_bc.py
# Loss: cross-entropy over the k candidate options at each decision point.

experiment_name: bc_mlp_yushin_ito_v1
seed: 42
device: auto            # auto -> cuda, else mps, else cpu; inference is CPU-only

data:
  # Records are featurized on the fly (see src/dataset/dataset.py for why there
  # is no precomputed .pt stage).
  records_path: data/datasets/kaggle_main_winners.jsonl.gz
  # Clone ONE expert. The record set spans ~137 teams playing different decks,
  # and the submission commits to a single deck; averaging incompatible
  # strategies is the classic BC failure. Yushin Ito is the largest single
  # block (24,207 records) and played one deck in 1000 of 1001 games.
  team: Yushin Ito
  # Held out BY EPISODE, not by decision: ~42 decisions come from one game and
  # are highly correlated, so a per-decision split leaks the same board states
  # into val and reports a flattering number.
  val_fraction: 0.1
  batch_size: 64
  num_workers: 4
  k_max: 80

model:
  type: mlp             # "mlp" | "transformer"
  num_cards: 1267
  state_embed_dim: 256
  hidden_dim: 512       # state encoder hidden width
  action_in_dim: 192    # 3 x 64 blocks; the v1 value of 16 was wrong (spec §0)
  action_embed_dim: 64
  scorer_hidden_dim: 128
  num_transformer_layers: 2   # transformer only
  num_heads: 4                # transformer only

optimizer:
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 25
  grad_clip: 1.0

checkpoint:
  save_dir: models/checkpoints/
  registry_dir: models/registry/

logging:
  wandb_project: ptcg-ai-challenge
  wandb_mode: online  # "online" | "offline" | "disabled"
  log_every_n_steps: 50
